<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" width="600" height="540" role="img" aria-labelledby="vision-title vision-description">
  <title id="vision-title">Three principles for research impact</title>
  <desc id="vision-description">Three equally sized circles represent Statistical Rigor, Scientific Relevance, and Practical Usability. Their shared intersection is labeled Impact and Adoption.</desc>

  <circle cx="210" cy="190" r="180" fill="#6fa8dc" fill-opacity="0.28" stroke="#3e78a5" stroke-width="2"/>
  <circle cx="390" cy="190" r="180" fill="#57b7a0" fill-opacity="0.28" stroke="#368a75" stroke-width="2"/>
  <circle cx="300" cy="345" r="180" fill="#f1bd57" fill-opacity="0.30" stroke="#bd8427" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">
    <text x="140" y="113" fill="#1f4e79">
      <tspan x="140">Statistical</tspan>
      <tspan x="140" dy="36">Rigor</tspan>
    </text>
    <text x="460" y="113" fill="#225d52">
      <tspan x="460">Scientific</tspan>
      <tspan x="460" dy="36">Relevance</tspan>
    </text>
    <text x="300" y="428" fill="#80540f">
      <tspan x="300">Practical</tspan>
      <tspan x="300" dy="36">Usability</tspan>
    </text>
    <text x="300" y="242" fill="#243541" font-weight="700">
      <tspan x="300">Impact &amp;</tspan>
      <tspan x="300" dy="32">Adoption</tspan>
    </text>
  </g>
</svg>
